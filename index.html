<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facebook</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="nav-left">
            <div class="logo">facebook</div>
            <div class="search-box">
                <input type="text" placeholder="Search Facebook" id="search-input">
            </div>
        </div>
        <div class="nav-center">
            <a href="#" class="nav-link active">
                <svg viewBox="0 0 24 24" width="24" height="24">
                    <path fill="currentColor" d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
                </svg>
            </a>
            <a href="#" class="nav-link">
                <svg viewBox="0 0 24 24" width="24" height="24">
                    <path fill="currentColor" d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/>
                </svg>
            </a>
        </div>
        <div class="nav-right">
            <div class="profile-menu">
                <img src="https://via.placeholder.com/40" alt="Profile" class="profile-pic">
                <span id="user-name">Mark Zuckerberg</span>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container">
        <!-- Left Sidebar -->
        <aside class="left-sidebar">
            <div class="sidebar-item">
                <img src="https://via.placeholder.com/40" alt="Profile" class="sidebar-icon">
                <span id="sidebar-name">Mark Zuckerberg</span>
            </div>
            <div class="sidebar-item">
                <svg viewBox="0 0 24 24" width="24" height="24" class="sidebar-icon">
                    <path fill="currentColor" d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/>
                </svg>
                <span>Friends</span>
            </div>
            <div class="sidebar-item">
                <svg viewBox="0 0 24 24" width="24" height="24" class="sidebar-icon">
                    <path fill="currentColor" d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
                </svg>
                <span>Pages</span>
            </div>
            <div class="sidebar-item">
                <svg viewBox="0 0 24 24" width="24" height="24" class="sidebar-icon">
                    <path fill="currentColor" d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/>
                </svg>
                <span>Messages</span>
            </div>
        </aside>

        <!-- Main Feed -->
        <main class="main-feed">
            <!-- Create Post -->
            <div class="create-post">
                <div class="create-post-header">
                    <img src="https://via.placeholder.com/40" alt="Profile" class="post-profile-pic">
                    <input type="text" placeholder="What's on your mind, Mark?" id="post-input">
                </div>
                <div class="create-post-actions">
                    <button class="post-action-btn">
                        <svg viewBox="0 0 24 24" width="24" height="24">
                            <path fill="#45bd62" d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/>
                        </svg>
                        Photo/Video
                    </button>
                    <button class="post-action-btn">
                        <svg viewBox="0 0 24 24" width="24" height="24">
                            <path fill="#f7b928" d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm3.5-9c.83 0 1.5-.67 1.5-1.5S16.33 8 15.5 8 14 8.67 14 9.5s.67 1.5 1.5 1.5zm-7 0c.83 0 1.5-.67 1.5-1.5S9.33 8 8.5 8 7 8.67 7 9.5 7.67 11 8.5 11zm3.5 6.5c2.33 0 4.31-1.46 5.11-3.5H6.89c.8 2.04 2.78 3.5 5.11 3.5z"/>
                        </svg>
                        Feeling/Activity
                    </button>
                </div>
            </div>

            <!-- Posts Container -->
            <div id="posts-container">
                <!-- Posts will be dynamically loaded here -->
            </div>
        </main>

        <!-- Right Sidebar -->
        <aside class="right-sidebar">
            <div class="sidebar-section">
                <h3>Friends</h3>
                <div id="friends-list">
                    <!-- Friends will be dynamically loaded here -->
                </div>
            </div>
        </aside>
    </div>

    <script src="script.js"></script>
</body>
</html>
